schemaVersion: 1
name: "srvcs-nearestvalue"
slug: "nearestvalue"
repository: "srvcs/nearestvalue"
package: "srvcs-nearestvalue"
function: "range: the element of a list nearest to value"
kind: "leaf"
categories:
  - "range"
dependencies: []
endpoints:
  - method: "GET"
    path: "/"
    purpose: "Service identity"
  - method: "POST"
    path: "/"
    purpose: "Evaluate the service function"
  - method: "GET"
    path: "/healthz"
    purpose: "Liveness probe"
  - method: "GET"
    path: "/readyz"
    purpose: "Readiness probe"
  - method: "GET"
    path: "/metrics"
    purpose: "Prometheus metrics"
  - method: "GET"
    path: "/openapi.json"
    purpose: "OpenAPI document"
inputs:
  - name: "value"
    type: "json"
    required: true
  - name: "values"
    type: "json[]"
    required: true
outputs:
  - name: "value"
    type: "integer"
  - name: "values"
    type: "integer[]"
  - name: "result"
    type: "integer"
configuration:
  - name: "SRVCS_BIND_ADDR"
    default: "0.0.0.0:8080"
    purpose: "Bind address"
  - name: "SRVCS_ENV"
    default: "development"
    purpose: "Environment label for logs"
  - name: "RUST_LOG"
    default: "info,tower_http=info"
    purpose: "Tracing filter"
